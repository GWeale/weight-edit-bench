<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weight Edit Lab · matched results</title><style>
body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#182936)}main{max-width:900px;margin:auto}h1{font-size:25px;letter-spacing:-.025em;margin:8px 0}p{line-height:1.5;font-size:14px;color:var(--muted-foreground,#526575)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}label{display:flex;flex-direction:column;gap:5px;font-size:12px}select{padding:8px;border:1px solid var(--border,#ccd5dc);border-radius:5px;background:var(--card,#fff);color:inherit;font:inherit;font-size:14px}select:focus-visible{outline:3px solid var(--primary,#0964b0)}.row{display:grid;grid-template-columns:115px 1fr 66px;align-items:center;gap:10px;min-height:55px}.name{font-size:14px}.track{height:24px;position:relative;border-left:1px solid var(--border,#ccd5dc);background:var(--secondary,#edf1f4)}.bar{position:absolute;top:0;height:24px;background:var(--chart-1,#0964b0)}.learned{background:var(--chart-2,#a65309)}.interval{position:absolute;top:11px;height:2px;background:var(--foreground,#182936)}.interval:before,.interval:after{content:"";position:absolute;top:-4px;height:10px;width:2px;background:inherit}.interval:before{left:0}.interval:after{right:0}.value{font:14px var(--font-mono,monospace);text-align:right}.axis{display:flex;justify-content:space-between;margin:4px 76px 16px 125px;font-size:12px;color:var(--muted-foreground,#526575)}.note{border-top:1px solid var(--border,#ccd5dc);padding-top:14px}.pair{font-size:14px;line-height:1.5}.legend{font-size:12px;color:var(--muted-foreground,#526575)}@media(max-width:450px){.row{grid-template-columns:95px 1fr 54px;gap:6px}.name,.value{font-size:12px}.axis{margin-left:101px;margin-right:60px}h1{font-size:22px}}
</style></head><body><main><h1>Weight editing: measured results</h1><p id="context"></p><div class="controls"><label>Task split<select id="split"></select></label><label>Reward mode<select id="mode"><option value="adapt">Adapt</option><option value="retain">Retain previous behavior</option></select></label><label>Final-test metric<select id="metric"><option value="final_test_mse">New task error</option><option value="retention_test_mse">Previous behavior error</option><option value="final_test_objective">Combined objective</option></select></label></div><p class="legend">Lower is better. Bars show means; whiskers show 95% bootstrap intervals across task seeds.</p><div id="chart" role="img" aria-label="Final test errors by editor"></div><div class="axis"><span>0</span><span id="maximum"></span></div><div id="pair" class="pair"></div><p class="note" id="limits"></p></main><script id="summaries" type="application/json">__SUMMARIES_JSON__</script><script>
const summaries=JSON.parse(document.getElementById('summaries').textContent),split=document.getElementById('split'),mode=document.getElementById('mode'),metric=document.getElementById('metric');
for(const s of summaries){const o=document.createElement('option');o.value=s.manifest.split;o.textContent=s.manifest.split==='ood'?'OOD · higher frequency':s.manifest.split;split.append(o);}
const labels={noop:'No edits',random:'Random edits',sgd:'Tuned SGD',adam:'Tuned Adam',learned_rate:'RL step-size'};
function draw(){const s=summaries.find(s=>s.manifest.split===split.value),rows=s.rows.filter(r=>r.mode===mode.value);const high=Math.max(.01,...rows.map(r=>{const m=r.metrics[metric.value];return m.ci95?m.ci95[1]:m.mean||0}))*1.08;const chart=document.getElementById('chart');chart.replaceChildren();for(const name of ['noop','random','sgd','adam','learned_rate']){const r=rows.find(r=>r.agent===name);if(!r)continue;const m=r.metrics[metric.value],row=document.createElement('div');row.className='row';const label=document.createElement('span');label.className='name';label.textContent=s.manifest.baseline_tuning?labels[name]:labels[name].replace('Tuned ','');const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar'+(name==='learned_rate'?' learned':'');bar.style.width=((m.mean||0)/high*100)+'%';track.append(bar);if(m.ci95){const ci=document.createElement('div');ci.className='interval';ci.style.left=(m.ci95[0]/high*100)+'%';ci.style.width=((m.ci95[1]-m.ci95[0])/high*100)+'%';track.append(ci);}const value=document.createElement('span');value.className='value';value.textContent=m.mean===null?'N/A':m.mean.toFixed(4);row.setAttribute('aria-label',`${labels[name]}: mean ${m.mean}, 95 percent interval ${m.ci95||'unavailable'}, ${r.completed} completed, ${r.errors} errors`);row.title=row.getAttribute('aria-label');row.append(label,track,value);chart.append(row);}document.getElementById('maximum').textContent=high.toFixed(2)+' MSE';document.getElementById('context').textContent=`${s.manifest.seeds.length} matched task seeds per editor and mode · ${s.manifest.config.horizon} edits per episode · ${s.rows.reduce((n,r)=>n+r.completed,0)} completed episodes in this split · ${s.rows.reduce((n,r)=>n+r.errors,0)} errors.`;const pair=s.paired_vs_adam.find(p=>p.mode===mode.value&&p.agent==='learned_rate');document.getElementById('pair').textContent=pair&&pair.mean!==null?`Paired combined-objective difference, RL minus Adam: ${pair.mean.toFixed(4)} (95% interval ${pair.ci95?pair.ci95.map(x=>x.toFixed(4)).join(' to '):'unavailable'}). Positive favors Adam. This comparison uses the mode’s combined objective, whichever metric is displayed above.`:'';const trained=s.manifest.policy?.training;document.getElementById('limits').textContent=`${trained?`RL checkpoint trained on ${trained.episodes} episodes with one training seed. `:'No recorded RL training provenance. '}${s.manifest.baseline_tuning?'Baseline rates selected on separate validation tasks. ':'Baseline rates are defaults, not validation-tuned. '}Intervals describe task variation, not training-seed uncertainty. Equal edit budgets do not equal total compute. These are small-network results, not evidence of LLM self-improvement.`;}
for(const el of [split,mode,metric])el.addEventListener('change',draw);draw();
</script></body></html>
