[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-edit-bench"
version = "0.1.0"
description = "RL environments and reproducible evaluations for neural-network weight-editing agents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "George Weale"}]
requires-python = ">=3.11"
dependencies = []
keywords = ["reinforcement-learning", "benchmark", "weight-editing", "model-editing"]

[project.urls]
Repository = "https://github.com/GWeale/weight-edit-bench"
Issues = "https://github.com/GWeale/weight-edit-bench/issues"

[project.optional-dependencies]
coding = ["torch>=2.6,<3", "transformers>=4.57.6,<5", "safetensors>=0.5,<1"]
gym = ["gymnasium>=1.0,<2"]
dev = ["build>=1.2,<2"]

[project.scripts]
weight-edit-lab = "weight_edit_lab.cli:main"
weight-edit-bench = "weight_edit_lab.cli:main"
weight-edit-coding = "weight_edit_lab.coding.cli:main"

[tool.setuptools.packages.find]
include = ["weight_edit_lab*"]

[tool.setuptools.package-data]
weight_edit_lab = ["*.html"]
