name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[gym,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Installed wheel and learning-loop smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          weight-edit-bench episode --agent adam --horizon 3 --out runs/episode.json
          weight-edit-bench verify runs/episode.json
          weight-edit-bench replay runs/episode.json --out runs/replay.html
          weight-edit-bench train --episodes 8 --horizon 3 --out runs/policy.json
          weight-edit-bench tune --seeds 1 --horizon 3 --out runs/tuning.json
          weight-edit-bench evaluate --seeds 2 --horizon 3 --policy runs/policy.json --tuning runs/tuning.json --out runs/evaluation
  coding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[coding,gym]'
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
